name: Desktop builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            extension: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            extension: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run desktop:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Pull request builds never receive the private updater signing key.
      - name: Build installers
        shell: bash
        run: bun run desktop:build --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: bun scripts/desktop-smoke.ts src-tauri/binaries/gex-backend-${{ matrix.target }}${{ matrix.extension }}
      - name: Install and launch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
